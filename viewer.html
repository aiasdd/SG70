<script>
  document.addEventListener("DOMContentLoaded", () => {
"use strict";

window.LabSite = (() => {
  const sourceBase = "https://aiasdd.github.io/DP750/";
  const stages = [
    { title: "준비", note: "실습에 필요한 Azure Databricks 작업 영역을 준비합니다." },
    { title: "보안 및 거버넌스", note: "Unity Catalog 객체에 대한 접근 제어를 실습합니다." },

    ["08", 2, "Unity Catalog로 데이터 정제, 변환 및 로드", "08-cleanse-transform-load-data-into-unity-catalog-KO", 50, "PySpark로 데이터를 정제하고 조인과 PIVOT으로 분석용 데이터를 구성합니다."],
    ["09", 2, "Unity Catalog에서 데이터 품질 제약 조건 구현 및 관리", "09-implement-manage-data-quality-constraints-unity-catalog-KO", 45, "Lakeflow 파이프라인에서 널·범위 검사와 스키마 드리프트를 처리합니다."],

    notebook: id === "00" ? "Labs/Notebooks/01-explore-azure-databricks-KO.ipynb" : `Labs/Notebooks/${stem}.ipynb`
  }));

  function viewerUrl(file) {
    const url = new URL("viewer.html", location.href);
    url.searchParams.set("file", file);
    const theme = new URLSearchParams(location.search).get("scoutTheme");
    if (theme === "light" || theme === "dark") url.searchParams.set("scoutTheme", theme);
    return url.href;
  }

  const requestedTheme = new URLSearchParams(location.search).get("scoutTheme");
  const systemTheme = matchMedia("(prefers-color-scheme: dark)");
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
  }
  setTheme(["light", "dark"].includes(requestedTheme) ? requestedTheme : systemTheme.matches ? "dark" : "light");
  systemTheme.addEventListener("change", event => {
    if (!new URLSearchParams(location.search).has("scoutTheme")) setTheme(event.matches ? "dark" : "light");
  });
  if (["light", "dark"].includes(requestedTheme)) {
    document.querySelectorAll('a[href^="index.html"], a[href^="viewer.html"]').forEach(link => {
      const url = new URL(link.href);
      url.searchParams.set("scoutTheme", requestedTheme);
      link.href = url.href;
    });
  }
  return { sourceBase, stages, labs, viewerUrl };
})();

  const title = document.getElementById("page-title");
  const contentArea = document.querySelector(".content-area");
  let sourceUrl;

  const imagePreview = document.getElementById("image-preview");
  const previewViewport = document.getElementById("image-preview-viewport");
  const previewImage = document.getElementById("image-preview-image");
  let previewSource;
  let previewScale = 1;
  let previewFit = 1;
  let previewDrag = null;
  let previewDragged = false;

  function sizePreview() {
    const viewport = previewViewport.getBoundingClientRect();
    previewFit = Math.min(
      Math.max(1, viewport.width - 48) / previewSource.naturalWidth,
      Math.max(1, viewport.height - 48) / previewSource.naturalHeight
    );
    previewImage.style.width = `${previewSource.naturalWidth * previewFit * previewScale}px`;
    previewImage.style.height = `${previewSource.naturalHeight * previewFit * previewScale}px`;
  }

  function openImagePreview(image) {
    if (!image.complete || !image.naturalWidth) {
      status.textContent = "이미지를 아직 표시할 수 없습니다. 이미지 로딩 상태와 네트워크 연결을 확인하세요.";
      status.className = "error-message";
      return;
    }
    previewSource = image;
    previewScale = 1;
    previewDragged = false;
    previewImage.src = image.currentSrc || image.src;
    previewImage.alt = image.alt;
    previewImage.style.width = "0px";
    previewImage.style.height = "0px";
    imagePreview.showModal();
    document.documentElement.classList.add("image-preview-open");
    sizePreview();
    previewViewport.scrollTo(0, 0);
  }

  document.getElementById("image-preview-close").addEventListener("click", () => imagePreview.close());
  previewImage.addEventListener("pointerdown", event => {
    if (!event.isPrimary || event.button !== 0) return;
    previewDragged = false;
    previewDrag = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      left: previewViewport.scrollLeft,
      top: previewViewport.scrollTop
    };
    previewImage.setPointerCapture(event.pointerId);
  });
  previewImage.addEventListener("pointermove", event => {
    if (!previewDrag || event.pointerId !== previewDrag.pointerId) return;
    const dx = event.clientX - previewDrag.x;
    const dy = event.clientY - previewDrag.y;
    if (!previewDragged && Math.hypot(dx, dy) < 5) return;
    previewDragged = true;
    previewImage.classList.add("is-dragging");
    previewViewport.scrollLeft = previewDrag.left - dx;
    previewViewport.scrollTop = previewDrag.top - dy;
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
    previewImage.addEventListener(type, event => {
      if (!previewDrag || event.pointerId !== previewDrag.pointerId) return;
      if (type !== "pointerup") previewDragged = true;
      previewDrag = null;
      previewImage.classList.remove("is-dragging");
    });
  });
  previewImage.addEventListener("click", () => {
    if (!previewDragged) imagePreview.close();
    previewDragged = false;
  });
  imagePreview.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      event.preventDefault();
      imagePreview.close();
    }
  });
  imagePreview.addEventListener("close", () => {
    if (previewDrag && previewImage.hasPointerCapture(previewDrag.pointerId)) {
      previewImage.releasePointerCapture(previewDrag.pointerId);
    }
    previewDrag = null;
    previewImage.classList.remove("is-dragging");
    document.documentElement.classList.remove("image-preview-open");
    previewImage.removeAttribute("src");
    previewSource?.focus({ preventScroll: true });
    previewSource = null;
  });
  previewViewport.addEventListener("wheel", event => {
    event.preventDefault();
    if (!event.deltaY) return;
    const before = previewImage.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (event.clientX - before.left) / before.width));
    const y = Math.max(0, Math.min(1, (event.clientY - before.top) / before.height));
    const unit = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 16
      : event.deltaMode === WheelEvent.DOM_DELTA_PAGE ? previewViewport.clientHeight : 1;
    previewScale = Math.max(.25, Math.min(8, previewScale * Math.exp(-event.deltaY * unit * .002)));
    sizePreview();
    const after = previewImage.getBoundingClientRect();
    previewViewport.scrollLeft += after.left + x * after.width - (before.left + x * before.width);
    previewViewport.scrollTop += after.top + y * after.height - (before.top + y * before.height);
  }, { passive: false });
  addEventListener("resize", () => {
    if (imagePreview.open) sizePreview();
  });

  function notifyHost(type, data = {}) {
    if (parent !== window) {
      parent.postMessage({ type, file, ...data }, location.protocol === "file:" ? "*" : location.origin);
    }
  }
  document.addEventListener("click", event => {
    if (parent === window || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = event.target instanceof Element ? event.target.closest("a[href]") : null;
    if (!link || link.target === "_blank") return;
    const target = new URL(link.href);
    if (target.origin !== location.origin) return;
    if (target.pathname === new URL("index.html", location.href).pathname) {
      event.preventDefault();
      notifyHost("labsite:home");
    } else if (target.pathname === new URL("viewer.html", location.href).pathname && target.searchParams.has("file")) {
      event.preventDefault();
      notifyHost("labsite:navigate", { file: target.searchParams.get("file"), hash: target.hash });
    }
  });

  const topbar = document.querySelector(".topbar");
  new ResizeObserver(() => {
    document.documentElement.style.setProperty("--cp-topbar-height", `${topbar.getBoundingClientRect().height}px`);
  }).observe(topbar);

  const tocToggle = document.getElementById("toc-toggle");
  const tocTitle = document.getElementById("toc-title");
  function toggleToc() {
    toc.hidden = !toc.hidden;
    [tocToggle, tocTitle].forEach(button => button.setAttribute("aria-expanded", String(!toc.hidden)));
    document.querySelector(".sidebar").classList.toggle("is-collapsed", toc.hidden);
    tocToggle.textContent = toc.hidden ? "+" : "−";
    tocToggle.setAttribute("aria-label", toc.hidden ? "목차 펼치기" : "목차 접기");
  }
  tocToggle.addEventListener("click", toggleToc);
  tocTitle.addEventListener("click", toggleToc);

  function scrollToHeading(id) {
    const heading = document.getElementById(id);
    if (!heading) return;
    if (matchMedia("(max-width: 768px)").matches) {
      heading.scrollIntoView({ behavior: "instant", block: "start" });
    } else {
      contentArea.scrollTo({
        top: heading.getBoundingClientRect().top - contentArea.getBoundingClientRect().top + contentArea.scrollTop - 8,
        behavior: "instant"
      });
    }
  }
  addEventListener("hashchange", () => {
    if (location.hash) scrollToHeading(decodeURIComponent(location.hash.slice(1)));
    notifyHost("labsite:position", { hash: location.hash });
  });

  function showError(error) {
    console.error("실습 문서 로드 실패:", error);
    status.textContent = `문서를 표시할 수 없습니다: ${error.message}`;
    status.className = "error-message";
    content.replaceChildren();
    const box = document.createElement("div");
    box.className = "error-box";
    const message = document.createElement("p");
    message.textContent = lab
      ? "네트워크 연결과 원본 사이트 상태를 확인한 뒤 다시 시도하세요."
      : "등록된 실습 파일만 열 수 있습니다. 실습 목록에서 문서를 선택하세요.";
    box.append(message);
    if (lab) {
      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "다시 시도";
      retry.addEventListener("click", load);
      box.append(retry);
    }
    content.append(box);
    content.setAttribute("aria-busy", "false");
    toc.textContent = "표시할 목차가 없습니다.";
  }

  function markdown(text) {
    const clean = text.replace(/^\uFEFF/, "").replace(/^---\r?\n[\s\S]*?\r?\n---(?:\r?\n|$)/, "");
    const template = document.createElement("template");
    template.innerHTML = DOMPurify.sanitize(marked.parse(clean), {
      USE_PROFILES: { html: true },
      FORBID_TAGS: ["style", "form", "input", "button", "textarea", "select"],
      FORBID_ATTR: ["style"]
    });
    return template.content;
  }

  function renderNotebook(text) {
    const notebook = JSON.parse(text);
    if (notebook.nbformat !== 4 || !Array.isArray(notebook.cells)) {
      throw new Error("지원하지 않는 노트북 형식입니다. nbformat 4 문서가 필요합니다.");
    }
    const fragment = document.createDocumentFragment();
    notebook.cells.forEach((cell, index) => {
      if (!cell || !["markdown", "code", "raw"].includes(cell.cell_type)) {
        throw new Error(`노트북 셀 ${index + 1}의 형식이 올바르지 않습니다.`);
      }
      const validSource = typeof cell.source === "string" ||
        (Array.isArray(cell.source) && cell.source.every(line => typeof line === "string"));
      if (!validSource) throw new Error(`노트북 셀 ${index + 1}에 유효한 소스가 없습니다.`);
      const source = Array.isArray(cell.source) ? cell.source.join("") : cell.source;
      const section = document.createElement("section");
      section.className = "notebook-cell";
      const label = document.createElement("p");
      label.className = "cell-label";
      label.textContent = `셀 ${index + 1} · ${cell.cell_type}`;
      section.append(label);
      if (cell.cell_type === "markdown") section.append(markdown(source));
      else {
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = source;
        pre.append(code);
        section.append(pre);
      }
      fragment.append(section);
    });
    return fragment;
  }

  async function copyCode(text) {
    try {
      if (!navigator.clipboard) throw new Error("HTTPS 또는 localhost에서 열어 주세요.");
      await navigator.clipboard.writeText(text);
      status.textContent = "코드를 클립보드에 복사했습니다.";
      status.className = "sr-only";
      return true;
    } catch (error) {
      console.error("코드 복사 실패:", error);
      status.textContent = `코드 복사 실패: ${error.message} 코드를 직접 선택해 복사하세요.`;
      status.className = "error-message";
      return false;
    }
  }

  function enhanceContent() {
    content.querySelectorAll("a[href]").forEach(link => {
      const label = link.textContent.trim();
      if (/^(?:https?:\/\/|www\.|mailto:)\S+$/i.test(label) ||
          /^(?:[a-z\d-]+\.)+[a-z]{2,}(?::\d+)?(?:[/?#]\S*)?$/i.test(label)) {
        link.classList.add("url-text");
      }
      const href = link.getAttribute("href");
      if (href.startsWith("#")) return;
      const url = new URL(href, sourceUrl);
      if (!["http:", "https:", "mailto:"].includes(url.protocol)) {
        link.removeAttribute("href");
        return;
      }
      const target = labs.find(item => [item.file, item.notebook].filter(Boolean)
        .some(path => new URL(path, sourceBase).href === `${url.origin}${url.pathname}`));
      if (target && !url.search) {
        const path = url.pathname.slice(new URL(sourceBase).pathname.length);
        link.href = viewerUrl(path) + url.hash;
      } else {
        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
    });
    content.querySelectorAll("img[src]").forEach(image => {
      let url = new URL(image.getAttribute("src"), sourceUrl);
      // The notebooks still reference this image in an older repository.
      if (url.href === "https://raw.githubusercontent.com/asddai/AzureDatabricks/main/Labs/Media/GenieCode.png") {
        url = new URL("Labs/Media/GenieCode.png", sourceBase);
      }
      if (!["http:", "https:"].includes(url.protocol)) {
        image.removeAttribute("src");
        return;
      }
      image.src = url.href;
      image.removeAttribute("srcset");
      image.loading = "eager";
      image.tabIndex = 0;
      image.setAttribute("role", "button");
      image.setAttribute("aria-haspopup", "dialog");
      image.setAttribute("aria-controls", "image-preview");
      image.setAttribute("aria-label", `${image.alt || "이미지"} 크게 보기`);
      image.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        openImagePreview(image);
      });
      image.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          event.stopPropagation();
          openImagePreview(image);
        }
      });
      image.addEventListener("error", () => {
        status.textContent = "일부 이미지를 불러오지 못했습니다. 네트워크 연결과 원본 서버 상태를 확인하세요.";
        status.className = "error-message";
      }, { once: true });
    });
    content.querySelectorAll("table").forEach(table => {
      const wrapper = document.createElement("div");
      wrapper.className = "table-scroll";
      wrapper.tabIndex = 0;
      wrapper.setAttribute("role", "region");
      wrapper.setAttribute("aria-label", "실습 표 (가로 스크롤 가능)");
      table.before(wrapper);
      wrapper.append(table);
    });
    content.querySelectorAll("pre").forEach(pre => {
      const code = pre.querySelector("code");
      if (!code) return;
      const wrapper = document.createElement("div");
      wrapper.className = "code-block-wrap";
      pre.before(wrapper);
      wrapper.append(pre);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "copy-button";
      button.textContent = "복사";
      button.setAttribute("aria-label", "코드 블록 복사");
      button.addEventListener("click", async () => {
        const copied = await copyCode(code.textContent);
        button.textContent = copied ? "복사됨" : "실패";
        setTimeout(() => { button.textContent = "복사"; }, 1200);
      });
      wrapper.append(button);
    });
    content.querySelectorAll("code").forEach(code => {
      if (code.closest("pre")) return;
      code.classList.add("inline-code-copy");
      code.dataset.copyLabel = "클릭하여 복사";
      code.title = "클릭하여 복사";
      code.tabIndex = 0;
      code.setAttribute("role", "button");
      code.setAttribute("aria-label", `코드 복사: ${code.textContent}`);
      const copy = async () => {
        const copied = await copyCode(code.textContent);
        code.dataset.copyLabel = copied ? "복사됨" : "복사 실패";
        setTimeout(() => { code.dataset.copyLabel = "클릭하여 복사"; }, 1200);
      };
      code.addEventListener("click", copy);
      code.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          copy();
        }
      });
    });
    const usedIds = new Set();
    const list = document.createElement("ul");
    const headings = content.querySelectorAll("h1, h2, h3, h4, h5, h6");
    headings.forEach((heading, index) => {
      const stem = heading.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-") || `section-${index}`;
      let id = stem;
      let suffix = 1;
      while (usedIds.has(id) || (document.getElementById(id) && document.getElementById(id) !== heading)) id = `${stem}-${suffix++}`;
      usedIds.add(id);
      heading.id = id;
      if (index === 0 || Number(heading.tagName.slice(1)) > 4) return;
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = `#${encodeURIComponent(id)}`;
      link.className = `level-${heading.tagName.slice(1)}`;
      link.textContent = heading.textContent;
      link.addEventListener("click", event => {
        event.preventDefault();
        toc.querySelectorAll("[aria-current]").forEach(active => active.removeAttribute("aria-current"));
        link.setAttribute("aria-current", "location");
        history.pushState(null, "", link.getAttribute("href"));
        scrollToHeading(id);
        notifyHost("labsite:position", { hash: location.hash });
      });
      item.append(link);
      list.append(item);
    });
    toc.replaceChildren(list);
    if (!list.children.length) toc.textContent = "이 문서에는 제목 목차가 없습니다.";
    if (location.hash) {
      scrollToHeading(decodeURIComponent(location.hash.slice(1)));
    }
  }

  async function load() {
    content.setAttribute("aria-busy", "true");
    content.replaceChildren();
    status.textContent = "DP750에서 원본 문서를 불러오는 중입니다…";
    status.className = "sr-only";
    toc.textContent = "문서를 불러오는 중입니다.";
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    try {
      if (!window.marked || !window.DOMPurify) {
        throw new Error("문서 렌더링 라이브러리를 불러오지 못했습니다. jsDelivr 연결을 확인하세요.");
      }
      const response = await fetch(sourceUrl, { signal: controller.signal });
      if (!response.ok) throw new Error(`원본 서버 응답: HTTP ${response.status}`);
      const text = await response.text();
      if (/^\s*<!doctype html|^\s*<html[\s>]/i.test(text)) {
        throw new Error("원본 파일 대신 HTML 페이지가 반환되었습니다.");
      }
      if (!text.trim()) throw new Error("원본 문서가 비어 있습니다.");
      content.replaceChildren(file.endsWith(".ipynb") ? renderNotebook(text) : markdown(text));
      const documentTitle = content.querySelector("h1")?.textContent.trim().replace(/^랩\s*\d+\s*:\s*/i, "");
      if (documentTitle) {
        title.textContent = documentTitle;
        document.title = `${documentTitle}${file.endsWith(".ipynb") ? " · 노트북" : ""} | Azure Databricks Labs`;
      }
      enhanceContent();
      notifyHost("labsite:title", { title: document.title });
      status.textContent = file.endsWith(".ipynb")
        ? "노트북을 불러왔습니다. Markdown과 소스 코드만 표시하며 실행 결과는 표시하지 않습니다."
        : "실습 가이드를 불러왔습니다.";
    } catch (error) {
      showError(error.name === "AbortError" ? new Error("원본 서버 연결 시간이 초과되었습니다. 다시 시도하세요.") : error);
    } finally {
      clearTimeout(timeout);
      content.setAttribute("aria-busy", "false");
    }
  }

  if (!lab) {
    showError(new Error("잘못된 파일 경로입니다."));
    return;
  }
  if (parent === window && (location.protocol === "http:" || location.protocol === "https:")) {
    history.replaceState({ labFile: file, labHash: location.hash }, "", new URL("./", location.href));
    location.reload();
    return;
  }
  const isNotebook = file === lab.notebook;
  sourceUrl = new URL(file, sourceBase).href;
  title.textContent = lab.title;
  document.title = `${lab.title}${isNotebook ? " · 노트북" : ""} | Azure Databricks Labs`;
  function configureLink(id, href, text) {
    const link = document.getElementById(id);
    link.href = href;
    if (text) link.textContent = text;
    link.removeAttribute("aria-disabled");
    link.removeAttribute("tabindex");
    link.hidden = false;
    return link;
  }
  const sequence = labs.filter(item => !["00", "04"].includes(item.id));
  const index = sequence.indexOf(lab);
  const previous = sequence[index - 1];
  const next = index >= 0 ? sequence[index + 1] : undefined;
  const targetFile = item => isNotebook && item.notebook ? item.notebook : item.file;
  if (previous) {
    const href = viewerUrl(targetFile(previous));
    configureLink("top-previous-link", href).setAttribute("aria-label", `이전 실습: ${previous.title}`);
  }
  if (next) {
    const href = viewerUrl(targetFile(next));
    configureLink("top-next-link", href).setAttribute("aria-label", `다음 실습: ${next.title}`);
  }
  load();
})();
  });
</script>
</body>
