.markdown img { display: block; max-width: 100%; height: auto; margin: 16px 0; border: 1px solid var(--cp-border); border-radius: .625rem; }
.markdown .table-scroll { max-width: 100%; overflow: auto; margin: 20px 0; }
.markdown table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.markdown th, .markdown td { padding: 12px; border: 1px solid var(--cp-border); text-align: left; min-width: 100px; }

.lab-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--cp-border); padding-top: 24px; margin-top: 32px; }

@media (max-width: 1000px) {
  .viewer-layout { padding: calc(16px / 3) 0 16px; }

@media (max-width: 768px) {
  .topbar { position: static; padding: 12px 16px; gap: 12px; flex-wrap: wrap; }

  .markdown :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 16px; }
  .lab-nav { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
@media print {
  .topbar, .sidebar, .toolbar, .lab-nav, .copy-button, .skip-link { display: none; }
  .viewer-layout { display: block; padding: 0; }
  .document { border: 0; padding: 0; }
  .markdown pre { white-space: pre-wrap; }
}

    <style>
      body.viewing-lab { overflow: hidden; }

  <body class="catalog-page">
    <div id="catalog">
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="hero shell">
    <div>
      <h1>Azure Databricks Labs</h1>
      <p class="hero-copy">Azure Data bricks의 데이터 수집 및 Lakeflow 파이프라인을 실습합니다.</p>
    </div>
  </header>
  <main class="shell" id="main">
    <p id="route-error" class="error-message" role="alert" hidden></p>
    <div id="lab-sections"></div>
    <noscript><p class="error-message">실습 목록을 표시하려면 JavaScript를 활성화하세요. <a href="https://aiasdd.github.io/DP750/">DP750 원본 목록 보기</a></p></noscript>

  <iframe id="lab-viewer" title="Azure Databricks 실습 상세" allow="clipboard-write" hidden></iframe>
<script>
  document.addEventListener("DOMContentLoaded", () => {
"use strict";

window.LabSite = (() => {
  const sourceBase = "https://aiasdd.github.io/DP750/";
  const stages = [
    { title: "준비", note: "실습에 필요한 Azure Databricks 작업 영역을 준비합니다." },
    { title: "보안 및 거버넌스", note: "Unity Catalog 객체에 대한 접근 제어를 실습합니다." },
    { title: "데이터 수집 및 품질", note: "데이터를 수집하고 정제하며 품질 제약 조건을 적용합니다." },
    { title: "데이터 파이프라인", note: "데이터 파이프라인을 설계하고 Lakeflow 작업으로 자동화합니다." }
  ];
  const rows = [
    ["00", 0, "Azure Databricks 환경 설정", "00-setup", 15, "Azure Cloud Shell에서 스크립트를 실행해 Databricks Premium 작업 영역과 리소스 그룹을 프로비저닝합니다."],
    ["04", 1, "보안 Unity 카탈로그 객체", "04-secure-unity-catalog-objects-KO", 50, "그룹 권한, 행 필터, 열 마스킹과 Key Vault 비밀 범위를 설정합니다."],
    ["07", 2, "Unity Catalog에 데이터 수집", "07-ingest-data-into-unity-catalog-KO", 50, "DataFrame, COPY INTO, CTAS와 Auto Loader로 데이터를 수집합니다."],
    ["08", 2, "Unity Catalog로 데이터 정제, 변환 및 로드", "08-cleanse-transform-load-data-into-unity-catalog-KO", 50, "PySpark로 데이터를 정제하고 조인과 PIVOT으로 분석용 데이터를 구성합니다."],
    ["09", 2, "Unity Catalog에서 데이터 품질 제약 조건 구현 및 관리", "09-implement-manage-data-quality-constraints-unity-catalog-KO", 45, "Lakeflow 파이프라인에서 널·범위 검사와 스키마 드리프트를 처리합니다."],
    ["10", 3, "Azure Databricks를 사용한 데이터 파이프라인 설계 및 구현", "10-design-implement-data-pipelines-KO", 45, "Bronze·Silver·Gold 파이프라인과 오류 처리, 매개변수화를 구현합니다."],
    ["11", 3, "Azure Databricks로 Lakeflow 작업 구현", "11-implement-lakeflow-jobs-KO", 45, "작업 종속성, 예약, 이벤트 트리거와 실패 알림을 구성합니다."]
  ];
  const labs = rows.map(([id, stage, title, stem, minutes, note]) => ({
    id, stage, title, minutes, note,
    file: `Labs/${stem}.md`,
    notebook: id === "00" ? "Labs/Notebooks/01-explore-azure-databricks-KO.ipynb" : `Labs/Notebooks/${stem}.ipynb`
  }));

  function viewerUrl(file) {
    const url = new URL("viewer.html", location.href);
    url.searchParams.set("file", file);
    const theme = new URLSearchParams(location.search).get("scoutTheme");
    if (theme === "light" || theme === "dark") url.searchParams.set("scoutTheme", theme);
    return url.href;
  }

  const requestedTheme = new URLSearchParams(location.search).get("scoutTheme");
  const systemTheme = matchMedia("(prefers-color-scheme: dark)");
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
  }
  setTheme(["light", "dark"].includes(requestedTheme) ? requestedTheme : systemTheme.matches ? "dark" : "light");
  systemTheme.addEventListener("change", event => {
    if (!new URLSearchParams(location.search).has("scoutTheme")) setTheme(event.matches ? "dark" : "light");
  });
  if (["light", "dark"].includes(requestedTheme)) {
    document.querySelectorAll('a[href^="index.html"], a[href^="viewer.html"]').forEach(link => {
      const url = new URL(link.href);
      url.searchParams.set("scoutTheme", requestedTheme);
      link.href = url.href;
    });
  }
  return { sourceBase, stages, labs, viewerUrl };
})();

"use strict";

(() => {
  const { stages, labs, viewerUrl } = window.LabSite;
  const root = document.getElementById("lab-sections");
  stages.forEach((stage, index) => {
    const section = document.createElement("section");
    section.className = "path-section";
    const heading = document.createElement("div");
    heading.className = "section-heading";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "section-toggle";
    toggle.textContent = "−";
    toggle.setAttribute("aria-expanded", "true");
    toggle.setAttribute("aria-controls", `stage-${index}`);
    toggle.setAttribute("aria-label", `${stage.title} 접기`);
    const description = document.createElement("div");
    const title = document.createElement("h2");
    title.textContent = stage.title;
    const note = document.createElement("p");
    note.textContent = stage.note;
    description.append(title, note);
    heading.append(toggle, description);
    const grid = document.createElement("div");
    grid.className = "cards";
    grid.id = `stage-${index}`;
    labs.filter(lab => lab.stage === index).forEach(lab => {
      const card = document.createElement("article");
      card.className = "lab-card";
      const meta = document.createElement("div");
      meta.className = "card-meta";
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = `LAB ${lab.id}`;
      const duration = document.createElement("span");
      duration.textContent = lab.id === "00" ? "Setup" : `${lab.minutes}분`;
      if (lab.id === "00") duration.className = "setup-chip";
      meta.append(badge, duration);
      const name = document.createElement("h3");
      name.textContent = lab.title;
      const summary = document.createElement("p");
      summary.textContent = lab.note;
      const links = document.createElement("div");
      links.className = "card-links";
      const guide = document.createElement("a");
      guide.className = "start";
      guide.href = viewerUrl(lab.file);
      guide.textContent = "가이드";
      guide.setAttribute("aria-label", `${lab.title} 가이드 보기`);
      links.append(guide);
      if (lab.notebook) {
        const notebook = document.createElement("a");
        notebook.href = viewerUrl(lab.notebook);
        notebook.textContent = "노트북";
        notebook.setAttribute("aria-label", `${lab.title} 노트북 보기`);
        links.append(notebook);
      }
      card.append(meta, name, summary, links);
      grid.append(card);
    });
    toggle.addEventListener("click", () => {
      grid.hidden = !grid.hidden;
      toggle.textContent = grid.hidden ? "+" : "−";
      toggle.setAttribute("aria-expanded", String(!grid.hidden));
      toggle.setAttribute("aria-label", `${stage.title} ${grid.hidden ? "펼치기" : "접기"}`);
    });
    section.append(heading, grid);
    root.append(section);
  });

})();

(() => {
  const { labs, viewerUrl } = window.LabSite;
  const catalog = document.getElementById("catalog");
  const frame = document.getElementById("lab-viewer");
  const error = document.getElementById("route-error");
  const listTitle = document.title;
  const rootUrl = new URL(location.protocol === "file:" ? "index.html" : "./", location.href).href;
  const viewerPath = new URL("viewer.html", location.href).pathname;
  const findLab = file => labs.find(lab => lab.file === file || lab.notebook === file);
  let activeUrl = "";
  let activeTitle = "";

  function render(state) {
    error.hidden = true;
    const file = state?.labFile;
    const lab = findLab(file);
    if (file && !lab) {
      console.error("등록되지 않은 실습 경로:", file);
      error.textContent = "등록되지 않은 실습입니다. 목록에서 실습을 선택하세요.";
      error.hidden = false;
    }
    catalog.hidden = Boolean(lab);
    frame.hidden = !lab;
    document.body.classList.toggle("viewing-lab", Boolean(lab));
    if (!lab) {
      document.title = listTitle;
      return;
    }
    const target = new URL(viewerUrl(file));
    target.hash = typeof state.labHash === "string" ? state.labHash : "";
    document.title = activeUrl === target.href && activeTitle
      ? activeTitle
      : `${lab.title} | Azure Databricks Labs`;
    if (activeUrl !== target.href) {
      activeUrl = target.href;
      activeTitle = "";
      frame.contentWindow.location.replace(target.href);
    }
  }

  function navigate(file, hash = "") {
    if (file !== null && !findLab(file)) {
      console.error("등록되지 않은 실습 이동 요청:", file);
      error.textContent = "실습을 열 수 없습니다. 목록에서 실습을 선택하세요.";
      error.hidden = false;
      return;
    }
    const state = file ? { labFile: file, labHash: hash } : null;
    history.pushState(state, "", rootUrl);
    render(state);
  }

  document.addEventListener("click", event => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = event.target instanceof Element ? event.target.closest("a[href]") : null;
    if (!link || link.target === "_blank") return;
    const target = new URL(link.href);
    if (target.origin !== location.origin || target.pathname !== viewerPath) return;
    event.preventDefault();
    navigate(target.searchParams.get("file"), target.hash);
  });
  addEventListener("message", event => {
    if (event.source !== frame.contentWindow || event.origin !== location.origin || !event.data || typeof event.data !== "object") return;
    const { type, file, hash, title } = event.data;
    if (type === "labsite:home") navigate(null);
    else if (type === "labsite:navigate") navigate(file, typeof hash === "string" ? hash : "");
    else if (typeof file === "string" && file === history.state?.labFile) {
      if (type === "labsite:title" && typeof title === "string") {
        activeTitle = title;
        document.title = title;
      } else if (type === "labsite:position" && typeof hash === "string") {
        history.replaceState({ ...history.state, labHash: hash }, "", rootUrl);
        const current = new URL(activeUrl);
        current.hash = hash;
        activeUrl = current.href;
      }
    }
  });
  addEventListener("popstate", () => render(history.state));
  if (location.protocol === "http:" || location.protocol === "https:") {
    history.replaceState(history.state, "", rootUrl);
  }
  render(history.state);
})();
  });
</script>
</body>
